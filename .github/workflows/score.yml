name: Score beaches
on:
  schedule:
    - cron: '7 */2 * * *'   # every 2 hours (at :07, GitHub runs can start a few minutes late)
  workflow_dispatch:        # lets you run it by hand from the Actions tab
permissions:
  contents: write
concurrency:
  group: score-beaches      # never let two runs overlap
  cancel-in-progress: false
jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node score.js
      - name: Save results
        run: |
          git config user.name "sharkleash-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git commit -m "Beach scores" || echo "No changes"
          git pull --rebase --autostash || true
          git push
