name: Score beaches
on:
  schedule:
    - cron: '45 11 * * *'   # 6:45 AM Eastern in winter, 7:45 AM in summer
    - cron: '45 19 * * *'   # 2:45 PM Eastern in winter, 3:45 PM in summer
  workflow_dispatch:        # lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node score.js
      - name: Save results
        run: |
          git config user.name "sharkleash-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git commit -m "Daily beach scores" || echo "No changes"
          git push
